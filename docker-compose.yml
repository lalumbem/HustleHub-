services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hustlehub-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
      - ./backend/.env.docker
    environment:
      PORT: "3000"
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./backend/cert:/app/cert:ro
    networks:
      - hustlehub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hustlehub-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - hustlehub-network

networks:
  hustlehub-network:
    driver: bridge
